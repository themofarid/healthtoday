name: Daily link watchdog

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run watchdog
        run: python -m tools watchdog
      - name: Commit changes
        id: commit
        run: |
          git config user.name "link-watchdog"
          git config user.email "actions@users.noreply.github.com"
          git add offers.csv site social
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Watchdog: update link status"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open issues for newly dead offers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while read -r slug; do
            [ -z "$slug" ] && continue
            gh issue create --title "Offer link is down: $slug" \
              --body "The daily check failed twice in a row for '$slug'. The page now shows an 'offer unavailable' notice. Check the offer in your affiliate dashboard."
          done < newly_dead.txt
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml
